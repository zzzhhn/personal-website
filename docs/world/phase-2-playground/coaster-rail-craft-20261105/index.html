<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轨道与支撑 · 实景对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#14232b;color:#f2ecdf;font:15px system-ui,-apple-system,sans-serif}main{max-width:1500px;margin:auto;padding:28px 24px}header{display:flex;align-items:baseline;justify-content:space-between;gap:16px}h1{font-size:27px;letter-spacing:.02em;font-weight:600;margin:0 0 18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}button,a{border:1px solid #65787d;background:transparent;color:inherit;border-radius:7px;padding:8px 15px;font:inherit;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#b97c4e;border-color:#b97c4e;color:#fff}figure{position:relative;width:100%;aspect-ratio:1710/875;margin:0;overflow:hidden;background:#0b161d;border:1px solid #53676b;border-radius:12px}figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}#before{clip-path:inset(0 50% 0 0)}#line{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff9}input{width:100%;accent-color:#dc9e6d;margin:18px 0}.sides{display:flex;justify-content:space-between;color:#b7c6c9}p{color:#b7c6c9;line-height:1.7;max-width:900px}footer{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:24px}small{color:#a9bfc4}button:focus-visible,a:focus-visible{outline:3px solid #6bddd8;outline-offset:3px}@media(max-width:700px){main{padding:20px 12px}h1{font-size:22px}header{display:block}nav{gap:5px}button,a{padding:8px 11px}}
</style><main><header><h1>轨道与支撑 · 实景对照</h1><small>同机位、同光照、同分辨率</small></header><nav aria-label="对照视角"><button data-view="bay" aria-pressed="true">轨道近景</button><button data-view="overview" aria-pressed="false">整圈远景</button><button id="day" aria-pressed="true">正午</button><button id="night" aria-pressed="false">深夜</button></nav><figure><img id="after" alt="精修后的实际网页画面"><img id="before" alt="精修前的实际网页画面"><div id="line"></div></figure><input id="split" type="range" min="0" max="100" value="50" aria-label="拖动查看前后差异"><div class="sides"><span>原版</span><span>精修候选</span></div><p>双钢轨、工字轨枕、连接座与支撑基础已精修。这里比较的是实际网页画面，保持同一条路线、同一套光照。4341 暂时保留稳定版本。</p><footer><a href="/world/?start=coaster&quality=balanced&car=optimized&chest=optimized&view=short-bay">打开 3D 候选</a><a href="after-detail-day.png">查看钢轨与接头近景</a><a href="README.md">制作与验证记录</a><a href="coaster-rail-representative.blend">可编辑轨道样段</a></footer></main><script>
let view='bay',time='day';const before=document.getElementById('before'),after=document.getElementById('after');function show(){before.src=`before-${view}-${time}.png`;after.src=`after-${view}-${time}.png`;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.getElementById('day').setAttribute('aria-pressed',String(time==='day'));document.getElementById('night').setAttribute('aria-pressed',String(time==='night'));}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;show()});document.getElementById('day').onclick=()=>{time='day';show()};document.getElementById('night').onclick=()=>{time='night';show()};document.getElementById('split').oninput=e=>{before.style.clipPath=`inset(0 ${100-e.target.value}% 0 0)`;document.getElementById('line').style.left=e.target.value+'%'};show();</script></html>

<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>营地 · 六类资产精修</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#142529;color:#f1eee5;font:15px system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;gap:20px;justify-content:space-between}h1{font-size:26px;font-weight:550;margin:0 0 8px}p{color:#b4c4c5;margin:0}a{color:#b6d7b6;text-decoration:none}nav{display:flex;gap:12px;align-items:center;margin:28px 0 16px;flex-wrap:wrap}select,button{font:inherit;background:#263c41;border:1px solid #52696e;color:inherit;padding:10px 16px;border-radius:6px}button[aria-pressed=true]{background:#c4d0ac;color:#162b2d}button:disabled{opacity:.4}.frame{position:relative;aspect-ratio:1710/875;overflow:hidden;border:1px solid #4b6063;border-radius:9px}.frame img{position:absolute;width:100%;height:100%;object-fit:contain}.after{clip-path:inset(0 0 0 var(--split,50%))}.line{position:absolute;left:var(--split,50%);height:100%;border-left:2px solid #fff8;pointer-events:none}.tag{position:absolute;bottom:14px;padding:6px 10px;background:#142529bd;border-radius:4px;pointer-events:none}.old{left:14px}.new{right:14px}input{width:100%;accent-color:#c4d0ac;margin:18px 0}footer{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:#91a9ae}small{display:block;margin-top:12px;color:#91a9ae}#error{margin:14px 0;color:#f0c587}#error[hidden]{display:none}a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #c4d0ac;outline-offset:4px}@media(max-width:600px){main{padding:20px 12px}header{align-items:start}h1{font-size:21px}header a{white-space:nowrap}footer{flex-direction:column;gap:4px}}
</style>
<main>
  <header><div><h1>营地，六类资产精修</h1><p>实际游戏画面 · 同机位对比</p></div><a id="play" href="/world/?start=tent&quality=balanced&paused=1">进入营地试玩 ↗</a></header>
  <nav>
    <select aria-label="对比资产" id="view">
      <option value="overview">营地总览</option><option value="shelter">小帐篷</option><option value="flags">旗杆与旗布</option><option value="books">书本与石板台</option><option value="tools">技能工具墙</option><option value="lamps">出口灯柱</option>
    </select><button id="day" aria-pressed="true">白天</button><button id="night" aria-pressed="false">深夜</button>
  </nav>
  <p id="error" role="status" hidden>图片尚未加载。可从 <a href="http://127.0.0.1:4341/camp-review/">4341 对比页</a> 重新打开。</p>
  <div class="frame" id="frame"><img id="before" alt="精修前的营地资产"><img id="after" class="after" alt="精修后的营地资产"><div class="line"></div><span class="tag old">精修前</span><span class="tag new">精修后</span></div>
  <input id="split" type="range" min="0" max="100" value="50" aria-label="前后对比位置">
  <footer><span>拖动滑杆查看细节</span><span>Balanced · 固定机位、曝光与画布</span></footer>
  <small>保留原布局、碰撞与交互。截图来自实际 WebGL，没有后期调色。</small>
</main>
<script>
const $=id=>document.getElementById(id);
const imageBase=new URL(location.protocol==='file:'?'../../../docs/world/phase-2-playground/camp-batch-20261107/evidence/':'images/',location.href);
if(location.protocol==='file:')$('play').href='http://127.0.0.1:4341/world/?start=tent&quality=balanced&paused=1';
let time='day',generation=0;
function render(){
  const view=$('view').value,hasNight=['overview','lamps'].includes(view),current=++generation;
  if(!hasNight)time='day';$('night').disabled=!hasNight;$('error').hidden=true;
  for(const t of ['day','night'])$(t).setAttribute('aria-pressed',String(time===t));
  for(const state of ['before','after']){
    const img=$(state);img.onerror=()=>{if(current===generation)$('error').hidden=false;};
    img.src=new URL(`${state}-${view}-${time}.jpg`,imageBase).href;
  }
}
$('view').onchange=render;for(const t of ['day','night'])$(t).onclick=()=>{time=t;render()};
$('split').oninput=()=>{$('frame').style.setProperty('--split',`${$('split').value}%`)};render();
</script>
</html>

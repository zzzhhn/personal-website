<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>城区与南滩 · 资产精修对比</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#142529;color:#f1eee5;font:15px system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;gap:20px;justify-content:space-between}h1{font-size:26px;font-weight:550;margin:0 0 8px}p{color:#b4c4c5;margin:0}a{color:#b6d7b6;text-decoration:none}nav{display:flex;gap:12px;align-items:center;margin:28px 0 16px;flex-wrap:wrap}select,button{font:inherit;background:#263c41;border:1px solid #52696e;color:inherit;padding:10px 16px;border-radius:6px}button[aria-pressed=true]{background:#c4d0ac;color:#162b2d}.frame{position:relative;aspect-ratio:1710/875;overflow:hidden;border:1px solid #4b6063;border-radius:9px}.frame img{position:absolute;width:100%;height:100%;object-fit:contain}.after{clip-path:inset(0 0 0 var(--split,50%))}.line{position:absolute;left:var(--split,50%);height:100%;border-left:2px solid #fff8;pointer-events:none}.tag{position:absolute;bottom:14px;padding:6px 10px;background:#142529bd;border-radius:4px;pointer-events:none}.old{left:14px}.new{right:14px}input{width:100%;accent-color:#c4d0ac;margin:18px 0}footer{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:#91a9ae}small{display:block;margin-top:12px;color:#91a9ae}@media(max-width:600px){main{padding:20px 12px}header{align-items:start}h1{font-size:21px}header a{white-space:nowrap}}
</style><main><header><div><h1>城区与南滩</h1><p>同机位、同画质的网页实景对比</p></div><a href="/world/?start=town&quality=balanced&paused=1">进入街区试玩 ↗</a></header>
<nav><select aria-label="对比资产" id="asset"></select><button id="day" aria-pressed="true">白天</button><button id="night" aria-pressed="false">深夜</button></nav>
<div class="frame" id="frame"><img id="before" alt="精修前"><img id="after" class="after" alt="精修后"><div class="line"></div><span class="tag old">精修前</span><span class="tag new">精修后</span></div>
<input id="split" type="range" min="0" max="100" value="50" aria-label="前后对比位置"><footer><span>拖动滑杆查看细节</span><span>Balanced · 固定曝光</span></footer><small>新增结构与共享 PBR 材质，沿用原来的场景布局与交互。此页是本地精修记录，未公开部署。</small></main>
<script>
const entries=[['moe-close','MoE 门厅近景'],['moe','MoE 与棕榈'],['sdic','国投证券建筑'],['wq','WorldQuant 幕墙'],['byte','字节建筑'],['rebirth','Video Rebirth 阳台'],['hunyuan','混元建筑'],['lowrise','沿海低层楼房'],['board','信息牌'],['kiosk','南滩售卖亭'],['tower','救生塔'],['avenue','街区全景']];
const nights=new Set(['moe','sdic','hunyuan','kiosk','tower']);let time='day';const $=id=>document.getElementById(id);
for(const [id,label]of entries)$('asset').add(new Option(label,id));
function render(){const id=$('asset').value;if(!nights.has(id))time='day';$('night').disabled=!nights.has(id);for(const t of ['day','night'])$(t).setAttribute('aria-pressed',String(time===t));for(const state of ['before','after'])$(state).src=`images/${state}-${id}-${time}.png`;}
$('asset').onchange=render;for(const t of ['day','night'])$(t).onclick=()=>{time=t;render()};$('split').oninput=()=>{$('frame').style.setProperty('--split',`${$('split').value}%`)};render();
</script></html>
